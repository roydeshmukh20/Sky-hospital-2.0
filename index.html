function getStatusBadgeHTML(status){
  let bgCls = '';
  let label = '';

  switch(status){
    case 'waiting':
      bgCls = 'bg-amber-100 text-amber-900 border-amber-300';
      label = 'Waiting';
      break;
    case 'with':

  }

}

/* ───────────── Schedule & Vacation Logic ───────────── */
function isDoctorOnVacation(doc, dateStr){
  if(!doc.vacations || !doc.vacations.length) return false;
  return doc.vacations.some(v => dateStr >= v.start && dateStr <= v.end);
}

function getShiftForDate(doc, dateStr){
  if(isDoctorOnVacation(doc, dateStr)){
    return {m:{on:false}, e:{on:false}, vacation:true};
  }
  const dow = new Date(dateStr+'T00:00:00').getDay();
  const activeDays = doc.weeklyPattern ? doc.weeklyPattern.days : [1,2,3,4,5,6];
  if(!activeDays.includes(dow)){
    return {m:{on:false}, e:{on:false}, vacation:false};
  }
  return {
    m: doc.weeklyPattern ? {...doc.weeklyPattern.m} : {on:true, s:'09:00', e:'13:00'},
    e: doc.weeklyPattern ? {...doc.weeklyPattern.e} : {on:true, s:'17:00', e:'20:00'},
    vacation: false
  };
}

function hoursOf(docId, dateStr){
  const doc = docById(docId);
  if(!doc) return [];
  const s = getShiftForDate(doc, dateStr);
  if(s.vacation) return [];
  return ['m','e'].filter(k=>s[k]&&s[k].on).map(k=>({k, s:s[k].s, e:s[k].e}));
}

function slotsFor(docId, dateStr, k){
  const doc = docById(docId);
  if(!doc) return [];
  const s = getShiftForDate(doc, dateStr);
  if(!s[k] || !s[k].on) return [];
  const out = [], end = toMin(s[k].e);
  for(let m = toMin(s[k].s); m + SLOT <= end; m += SLOT){
    const t0 = fromMin(m);
    const booked = S.patients.some(p => p.docId === docId && p.date === dateStr && p.slot === t0 && p.status !== 'cancelled');
    const past = dateStr === today() && m <= nowMin();
    out.push({t: t0, state: booked ? 'booked' : past ? 'past' : 'free'});
  }
  return out;
}

/* ───────────── Queue Calculations ───────────── */
function laneAll(docId){
  const tdy = today();
  const l = S.patients.filter(p=>p.docId===docId && p.date===tdy && p.status!=='cancelled');
  const done = l.filter(p=>p.status==='done').sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  return [...done, ...l.filter(p=>p.status==='with'), ...l.filter(p=>p.status==='waiting')];
}
function tok(p){ 
  const doc = docById(p.docId);
  const code = doc ? doc.code : 'D';
  const i = laneAll(p.docId).indexOf(p);
  return i<0 ? '—' : code+'-'+(i+1); 
}
function qInfo(p){
  const lane = laneAll(p.docId), idx = lane.indexOf(p);
  if(idx<0) return null;
  const ahead = lane.slice(0,idx).filter(q=>q.status!=='done').length;
  const dl = S.delays[p.docId], full = !!(dl && dl.full), delay = dl && !dl.full ? dl.mins : 0;
  const wait = p.status==='with' ? 0 : ahead*SLOT + delay;
  let eta = nowMin()+wait; if(p.slot) eta = Math.max(eta, toMin(p.slot));
  return {idx, ahead, wait, eta, full, delay, serving: lane.find(q=>q.status==='with')};
}

  const el = document.createElement('div');
  el.className = 'toast pointer-events-auto rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-lg '+(type==='err'?'bg-rose-600':type==='warn'?'bg-amber-600':'bg-slate-900');
  el.innerHTML = `<i class="fa-solid ${type==='err'?'fa-circle-exclamation':'fa-circle-check'} mr-2"></i>${esc(msg)}`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3600);
}

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-bold text-slate-700"><i class="fa-solid fa-plane-departure text-rose-500 mr-1"></i>Vacations / Time-Off</span>
              <button data-act="openVacationModal" data-id="${doc.id}" class="text-[11px] font-bold text-blue-600 hover:underline">+ Add Vacation</button>
            </div>
            ${doc.vacations && doc.vacations.length ? `
              <div class="space-y-1">
                ${doc.vacations.map((v, idx) => `
                  <div class="flex items-center justify-between rounded-lg bg-rose-50 px-2.5 py-1 text-[11px] text-rose-800 border border-rose-100">
                    <span>${v.start} to ${v.end} ${v.reason ? '('+v.reason+')':''}</span>
                    <button data-act="removeVacation" data-doc="${doc.id}" data-idx="${idx}" class="text-rose-600 font-bold ml-2">×</button>
                  </div>
                `).join('')}
              </div>
            ` : '<p class="text-[11px] text-slate-400 italic">No upcoming time-off</p>'}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ───────────── Modal Dialog Renderers ───────────── */

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold text-slate-700">Specialty *</label>

        <div>
          <label class="font-bold text-slate-700">Consultation Fee (₹) *</label>
          <input id="doc-fee" type="number" value="${docEditing.fee}" class="${B.input} mt-1">

      <div class="grid grid-cols-2 gap-2">

          <label class="font-bold text-slate-700">UPI ID for Payments</label>

        <div>
          <label class="font-bold text-slate-700">Badge Code & Color</label>
          <div class="flex gap-2 mt-1">
            <input id="doc-code" maxlength="2" value="${esc(docEditing.code)}" class="${B.input} w-16 text-center font-extrabold uppercase">
            <input id="doc-color" type="color" value="${docEditing.color}" class="h-[44px] w-full rounded-xl cursor-pointer border border-slate-300 p-1">
          </div>

      </div>

      <hr class="border-slate-100">

      <div>
        <label class="font-bold text-slate-800">Weekly Active Days</label>

            <label class="flex items-center gap-1 rounded-lg border border-slate-200 bg-slate-50 px-2 py-1 cursor-pointer">
              <input type="checkbox" data-day="${d}" ${p.days.includes(d)?'checked':''}>

        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <div class="rounded-xl border border-slate-200 p-2.5 bg-slate-50 space-y-2">
          <label class="flex items-center justify-between font-bold text-slate-800">
            <span>Morning Shift</span>
            <input type="checkbox" id="m-on" ${p.m.on?'checked':''}>
          </label>
          <div class="grid grid-cols-2 gap-1">
            <input id="m-start" type="time" value="${p.m.s}" class="rounded border p-1 text-xs">
            <input id="m-end" type="time" value="${p.m.e}" class="rounded border p-1 text-xs">
          </div>

        <div class="rounded-xl border border-slate-200 p-2.5 bg-slate-50 space-y-2">

            <input type="checkbox" id="e-on" ${p.e.on?'checked':''}>
          </label>
          <div class="grid grid-cols-2 gap-1">
            <input id="e-start" type="time" value="${p.e.s}" class="rounded border p-1 text-xs">
            <input id="e-end" type="time" value="${p.e.e}" class="rounded border p-1 text-xs">

      <div class="flex justify-end gap-2 pt-3">

/* ───────────── Drag and Drop Priority Reordering Event Handlers ───────────── */
document.addEventListener('dragstart', (e) => {
  const row = e.target.closest('.draggable-row');
  if(!row) return;
  draggedPatientId = row.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(()=>row.classList.add('opacity-40'), 0);
});

document.addEventListener('dragend', (e) => {
  const row = e.target.closest('.draggable-row');
  if(row) row.classList.remove('opacity-40');
  document.querySelectorAll('.queue-lane > div').forEach(el => el.classList.remove('drag-over'));
  draggedPatientId = null;
});

document.addEventListener('dragover', (e) => {
  e.preventDefault();
  const lane = e.target.closest('.queue-lane');
  if(!lane) return;
  const row = e.target.closest('.draggable-row');
  document.querySelectorAll('.queue-lane > div').forEach(el => el.classList.remove('drag-over'));
  if(row) row.classList.add('drag-over');
});

document.addEventListener('dragleave', (e) => {
  const row = e.target.closest('.draggable-row');
  if(row) row.classList.remove('drag-over');
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  const lane = e.target.closest('.queue-lane');
  if(!lane || !draggedPatientId) return;

  const targetRow = e.target.closest('.draggable-row');
  const targetPatientId = targetRow ? targetRow.dataset.id : null;
  const targetDocId = lane.dataset.docid;

  const patIdx = S.patients.findIndex(p => p.id === draggedPatientId);
  if(patIdx < 0) return;

  // Update patient's assigned doctor if dragged across lanes
  S.patients[patIdx].docId = targetDocId;

  // Reorder inside the master patients array
  const patientObj = S.patients.splice(patIdx, 1)[0];

  if(targetPatientId && targetPatientId !== draggedPatientId){
    const newTargetIdx = S.patients.findIndex(p => p.id === targetPatientId);
    if(newTargetIdx >= 0){
      S.patients.splice(newTargetIdx, 0, patientObj);
    } else {
      S.patients.push(patientObj);
    }
  } else {
    S.patients.push(patientObj);
  }

  save();
  toast('Queue priority adjusted successfully');
});

/* ───────────── Global Action Event Delegation ───────────── */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;

  if(act==='role'){ ui.role = btn.dataset.id; saveUI(); render(); }
  if(act==='scan'){ ui.pStage = 'form'; render(); }
  if(act==='pickDoc'){ draft.docId = btn.dataset.id; draft.shift = ''; draft.slot = ''; render(); }
  if(act==='pickDate'){ draft.date = btn.dataset.date; draft.shift = ''; draft.slot = ''; render(); }
  if(act==='pickShift'){ draft.shift = btn.dataset.id; draft.slot = ''; render(); }
  if(act==='pickSlot'){ draft.slot = btn.dataset.id; render(); }
  if(act==='pickMode'){ draft.mode = btn.dataset.mode; if(draft.mode==='walkin') draft.slot='walkin'; else draft.slot=''; render(); }
  
  if(act==='submitReg'){
    if(!draft.name.trim() || !draft.phone || draft.phone.length<10 || !draft.docId){
      toast('Please fill all required fields correctly', 'err');
      return;
    }
    const newPat = {
      id: uid(), name: draft.name, phone: draft.phone, age: draft.age, gender: draft.gender, address: draft.address,
      docId: draft.docId, date: draft.date, slot: draft.slot === 'walkin' ? '' : draft.slot,
      shift: draft.shift, status: 'waiting', fee: docById(draft.docId).fee,
      pay: {state:'due', method:null, at:null}, lang: ui.lang, createdAt: Date.now()
    };
    S.patients.push(newPat);
    ui.me = newPat.id;
    draft = newDraft();
    save();
    toast('OPD Token Registered Successfully!');
  }

  if(act==='newPatientReg'){ ui.me = null; ui.pStage = 'form'; draft = newDraft(); render(); }
  if(act==='cancelMyToken'){
    const p = S.patients.find(q=>q.id===ui.me);
    if(p){ p.status = 'cancelled'; save(); toast('Token cancelled', 'warn'); }
  }
  if(act==='openQuickAdd'){ ui.role = 'patient'; ui.pStage = 'form'; draft = newDraft(); render(); }
  
  if(act==='openEmergencyModal'){ openEmergencyBlockModal(); }
  if(act==='saveEmergencyBlock'){
    const docId = $('#emg-doc').value;
    const dur = $('#emg-dur').value;
    S.delays[docId] = dur === 'full' ? {full: true, mins: 0} : {full: false, mins: parseInt(dur)};
    closeDialog();
    save();
    toast('Emergency alert broadcasted via SMS');
  }

  if(act==='openAddDocModal'){ openAddEditDoctorModal(null); }
  if(act==='openEditDocModal'){ openAddEditDoctorModal(btn.dataset.id); }
  if(act==='deleteDoc'){
    if(confirm('Are you sure you want to remove this doctor?')){
      S.doctors = S.doctors.filter(d=>d.id!==btn.dataset.id);
      save();
      toast('Doctor removed');
    }
  }
  if(act==='saveDoctor'){
    const name = $('#doc-name').value.trim();
    const spec = $('#doc-spec').value.trim();
    const fee = parseFloat($('#doc-fee').value) || 500;
    const upi = $('#doc-upi').value.trim();
    const code = $('#doc-code').value.trim() || 'D';
    const color = $('#doc-color').value;

    if(!name || !spec){ toast('Name and specialty are required', 'err'); return; }

    const checkedDays = Array.from(document.querySelectorAll('input[data-day]:checked')).map(cb=>Number(cb.dataset.day));
    
    docEditing.name = name;
    docEditing.spec.en = spec; docEditing.spec.hi = spec; docEditing.spec.mr = spec;
    docEditing.fee = fee;
    docEditing.upi = upi;
    docEditing.code = code;
    docEditing.color = color;
    docEditing.weeklyPattern = {
      days: checkedDays,
      m: {on: $('#m-on').checked, s: $('#m-start').value, e: $('#m-end').value},
      e: {on: $('#e-on').checked, s: $('#e-start').value, e: $('#e-end').value}
    };

    const idx = S.doctors.findIndex(d=>d.id===docEditing.id);
    if(idx>=0) S.doctors[idx] = docEditing;
    else S.doctors.push(docEditing);

    closeDialog();
    save();
    toast('Doctor configuration saved');
  }

  if(act==='openVacationModal'){ openVacationModal(btn.dataset.id); }
  if(act==='saveVacation'){
    const doc = docById(btn.dataset.id);
    const start = $('#vac-start').value;
    const end = $('#vac-end').value;
    const reason = $('#vac-reason').value.trim();
    if(start && end){
      doc.vacations = doc.vacations || [];
      doc.vacations.push({start, end, reason});
      closeDialog();
      save();
      toast('Vacation added');
    }
  }
  if(act==='removeVacation'){
    const doc = docById(btn.dataset.doc);
    const idx = Number(btn.dataset.idx);
    doc.vacations.splice(idx,1);
    save();
    toast('Vacation removed');
  }

  if(act==='resetDemo'){ seedState(); save(); toast('Demo data reset'); }
});

document.addEventListener('input', (e) => {
  if(e.target.dataset.draft){
    draft[e.target.dataset.draft] = e.target.value;
  }
});

document.addEventListener('change', (e) => {
  if(e.target.dataset.chg==='lang'){ ui.lang = e.target.value; render(); }
  if(e.target.dataset.chg==='pStatus'){
    const p = S.patients.find(q=>q.id===e.target.dataset.id);
    if(p){ p.status = e.target.value; if(p.status==='done') p.doneAt = Date.now(); save(); }
  }
});

/* ───────────── Initialization ───────────── */
loadState();
loadUI();
render();

})();
</script>
