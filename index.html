<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Sky Multispecialty Hospital — Digital OPD</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>if(window.tailwind)tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','Noto Sans Devanagari','system-ui','sans-serif']}}}}</script>
<style>
  body{background:#f1f5f9;-webkit-tap-highlight-color:transparent}
  @keyframes scanBeam{0%{top:8%}50%{top:88%}100%{top:8%}}
  .scan-line{animation:scanBeam 2.4s infinite ease-in-out}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .bar{transform-origin:bottom;animation:grow .5s ease-out}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}
  .pulse{animation:pulseDot 1.6s infinite}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .toast{animation:slideIn .2s ease-out}
  .drag-handle{touch-action:none;cursor:grab}
  .qcard.dragging{opacity:.85;box-shadow:0 12px 28px rgba(15,23,42,.25);outline:2px solid #2563eb}
  dialog{border:0;padding:0;border-radius:1rem;max-height:92vh;overflow:auto}
  dialog::backdrop{background:rgba(15,23,42,.55);backdrop-filter:blur(2px)}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
  button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  @media print{#app,#toasts{display:none!important}dialog[open]{position:static;box-shadow:none;max-width:100%}dialog::backdrop{display:none}.no-print{display:none!important}}
</style>
</head>
<body class="min-h-screen font-sans text-slate-800 antialiased">

<div id="toasts" class="pointer-events-none fixed inset-x-0 top-16 z-50 mx-auto flex max-w-md flex-col gap-2 px-3" aria-live="polite" role="status"></div>
<dialog id="dlg"><div id="dlg-body"></div></dialog>

function defaultShift(docId, dateStr){
  const dow = new Date(dateStr+'T00:00:00').getDay();     // 0 = Sunday
  const off = {on:false,s:'09:00',e:'13:00'};
  const m = (s,e)=>({on:true,s,e});
  let morning = off, evening = {on:false,s:'17:00',e:'20:00'};
  if(docId==='patel'){ morning = dow===0 ? m('10:00','12:00') : m('09:00','13:00'); if(dow!==0) evening = m('17:00','20:00'); }
  if(docId==='sonone'){ if(dow!==0) morning = m('09:30','13:00'); if([1,3,5].includes(dow)) evening = m('17:00','19:30'); }
  if(docId==='rathi'){ if([2,4,6].includes(dow)) morning = m('10:00','13:00'); if(dow>=1&&dow<=5) evening = m('17:30','20:00'); }
  return {m:{...morning}, e:{...evening}};
}
function ensureSchedule(){
  S.sched = S.sched || {};
  S.doctors.forEach(d=>{
    S.sched[d.id] = S.sched[d.id] || {};
    for(let i=0;i<7;i++){ const ds=addDays(today(),i); if(!S.sched[d.id][ds]) S.sched[d.id][ds]=defaultShift(d.id,ds); }
    Object.keys(S.sched[d.id]).forEach(k=>{ if(k<addDays(today(),-1)) delete S.sched[d.id][k]; });
  });
}

/* ───────────── Queue logic ───────────── */
function laneAll(docId){
  const tdy = today();
  const l = S.patients.filter(p=>p.docId===docId && p.date===tdy && p.status!=='cancelled');
  const done = l.filter(p=>p.status==='done').sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  return [...done, ...l.filter(p=>p.status==='with'), ...l.filter(p=>p.status==='waiting')];
}
function tok(p){ const i = laneAll(p.docId).indexOf(p); return i<0 ? '—' : docById(p.docId).code+'-'+(i+1); }
function qInfo(p){
  const lane = laneAll(p.docId), idx = lane.indexOf(p);
  if(idx<0) return null;
  const ahead = lane.slice(0,idx).filter(q=>q.status!=='done').length;
  const dl = S.delays[p.docId], full = !!(dl && dl.full), delay = dl && !dl.full ? dl.mins : 0;
  const wait = p.status==='with' ? 0 : ahead*SLOT + delay;
  let eta = nowMin()+wait; if(p.slot) eta = Math.max(eta, toMin(p.slot));
  return {idx, ahead, wait, eta, full, delay, serving: lane.find(q=>q.status==='with')};
}
function hoursOf(docId,date){ const s=S.sched[docId] && S.sched[docId][date]; return s ? ['m','e'].filter(k=>s[k].on).map(k=>({k,s:s[k].s,e:s[k].e})) : []; }
function slotsFor(docId,date,k){
  const s = S.sched[docId] && S.sched[docId][date]; if(!s || !s[k].on) return [];
  const out=[], end=toMin(s[k].e);
  for(let m=toMin(s[k].s); m+SLOT<=end; m+=SLOT){
    const t0=fromMin(m);
    const booked = S.patients.some(p=>p.docId===docId&&p.date===date&&p.slot===t0&&p.status!=='cancelled');
    const past = date===today() && m<=nowMin();
    out.push({t:t0,state:booked?'booked':past?'past':'free'});
  }
  return out;
}
function canWalkIn(docId){
  const dl=S.delays[docId]; if(dl&&dl.full) return false;
  return hoursOf(docId,today()).some(h=>toMin(h.e)>nowMin());
}
function insertPatient(p){
  if(p.slot){
    const i = S.patients.findIndex(q=>q.docId===p.docId&&q.date===p.date&&q.status==='waiting'&&(!q.slot||q.slot>p.slot));
    if(i>=0){ S.patients.splice(i,0,p); return; }
  }
  S.patients.push(p);
}
function notify(p,key,vars){
  const doc = docById(p.docId);
  const text = tx(p.lang||'en',key,{doc:doc.name,link:baseUrl()+'?p='+p.id,...vars});
  const ts = Date.now();
  ['SMS','WhatsApp'].forEach(ch=>S.notes.unshift({id:uid(),pid:p.id,ch,text,ts}));
  S.notes = S.notes.slice(0,200);
}
function afterChange(){
  S.doctors.forEach(d=>laneAll(d.id).forEach(p=>{
    if(p.status!=='waiting' || p.nearSent) return;
    const i = qInfo(p);
    if(i && i.ahead===1){ p.nearSent = true; notify(p,'n_next',{token:tok(p)}); }
  }));
}

function toast(msg,type){
  const el = document.createElement('div');
  el.className = 'toast pointer-events-auto rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-lg '+(type==='err'?'bg-rose-600':type==='warn'?'bg-amber-600':'bg-slate-900');
  el.innerHTML = `<i class="fa-solid ${type==='err'?'fa-circle-exclamation':'fa-circle-check'} mr-2"></i>${esc(msg)}`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3600);
}

  if(p.pay.state==='paid') return `<section class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4"><div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-full bg-emerald-600 text-white"><i class="fa-solid fa-check"></i></span><div><p class="text-sm font-bold text-emerald-800">${esc(t('payDone'))}</p><p class="text-xs text-emerald-700">${money(p.fee)} · ${esc(t('paidVia',{method:methodName(L(),p.pay.method)}))}</p></div></div></section>`;
  const link = upiLink(doc,p), qr = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=6&data='+encodeURIComponent(link);
  return `<section class="rounded-2xl bg-slate-900 p-4 text-center text-white">
    <div class="flex items-center justify-between text-left"><p class="text-xs font-bold text-cyan-300"><i class="fa-solid fa-qrcode mr-1"></i>${esc(t('payTitle'))}</p>${pill(esc(p.pay.state==='claimed'?t('claimed'):t('due')), p.pay.state==='claimed'?'bg-amber-100 text-amber-800':'bg-rose-100 text-rose-800')}</div>
    <p class="mt-2 text-sm font-semibold">${esc(t('payTo',{amt:p.fee,doc:doc.name}))}</p>
    <div class="mx-auto my-3 inline-block rounded-xl bg-white p-2"><img src="${qr}" alt="UPI QR" class="h-44 w-44" onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')"><p class="hidden h-44 w-44 p-4 text-xs text-slate-500">QR unavailable offline — use the UPI ID below.</p></div>
    <p class="text-[11px] text-slate-400">${esc(t('scanToPay'))}</p>
    <p class="mt-1 select-all text-sm font-bold">${esc(t('upiId'))}: ${esc(doc.upi)}</p>
    <div class="mt-3 grid ${p.pay.state==='due'?'grid-cols-2':'grid-cols-1'} gap-2">
     <a href="${esc(link)}" class="${B.sm} min-h-[44px] bg-cyan-500 text-slate-900 hover:bg-cyan-400"><i class="fa-solid fa-mobile-screen-button"></i>${esc(t('openUpi'))}</a>
     ${p.pay.state==='due'?`<button data-act="iPaid" class="${B.sm} min-h-[44px] bg-white/10 text-white hover:bg-white/20"><i class="fa-solid fa-check"></i>${esc(t('iPaid'))}</button>`:''}
    </div>
    ${p.pay.state==='claimed'?`<p class="mt-2 text-[11px] text-amber-300">${esc(t('payNote'))}</p>`:''}</section>`;
}
function ticketHTML(p){
  const doc = docById(p.docId), isToday = p.date===today();
  if(p.status==='cancelled') return `<section class="${B.card} text-center"><span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-rose-100 text-xl text-rose-600"><i class="fa-solid fa-xmark"></i></span><h2 class="mt-3 text-lg font-extrabold">${esc(t('cancelledTitle'))}</h2><p class="text-sm text-slate-500">${esc(t('cancelledSub'))}</p><button data-act="newReg" class="${B.primary} mt-4 w-full">${esc(t('newReg'))}</button></section>`;
  if(p.status==='done') return `<section class="${B.card} text-center"><span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-emerald-100 text-xl text-emerald-600"><i class="fa-solid fa-check"></i></span><h2 class="mt-3 text-lg font-extrabold">${esc(t('doneTitle'))}</h2><p class="text-sm text-slate-500">${esc(t('doneSub'))}</p></section><div class="mt-4">${payHTML(p,doc)}</div><button data-act="newReg" class="${B.ghost} mt-4 w-full">${esc(t('newReg'))}</button>`;
  const info = isToday ? qInfo(p) : null;
  const dl = S.delays[p.docId];
  const stCls = p.status==='with' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800';
  const stTxt = !isToday ? t('stBooked') : p.status==='with' ? t('stWith') : t('stWaiting');
  const notes = S.notes.filter(n=>n.pid===p.id).slice(0,8);
  let queueCard = '';
  if(isToday && info){
    if(info.full) queueCard = `<div class="rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm font-semibold text-rose-700"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${esc(t('docUnavail',{doc:doc.name}))}</div>`;
    else if(p.status==='with') queueCard = `<div class="rounded-2xl bg-emerald-600 p-4 text-center text-white"><i class="fa-solid fa-bell mb-1 text-xl"></i><p class="text-sm font-bold">${esc(t('yourTurn'))}</p></div>`;
    else {
      const dots = Array.from({length:Math.min(info.ahead,8)},()=>'<span class="h-3 w-3 rounded-full bg-slate-300"></span>').join('');
      queueCard = `<div class="${B.card}"><div class="flex items-end justify-between"><div><p class="text-[11px] font-bold uppercase tracking-wide text-slate-400">${esc(t('estWait'))}</p><p class="text-3xl font-black text-blue-700 tabular-nums">~${info.wait}<span class="ml-1 text-sm font-bold text-slate-500">${esc(t('min'))}</span></p></div>
        <div class="text-right"><p class="text-sm font-bold">${esc(info.ahead===0?t('aheadNone'):t('ahead',{n:info.ahead}))}</p><p class="text-[11px] text-slate-500">${esc(t('expected',{time:fmt12(info.eta)}))}</p></div></div>
        <div class="mt-3 flex items-center gap-1.5" aria-hidden="true">${dots}${info.ahead>8?'<span class="text-[10px] text-slate-400">+'+(info.ahead-8)+'</span>':''}<span class="grid h-6 w-6 place-items-center rounded-full bg-blue-600 text-[10px] font-bold text-white">${t('rescan')?'★':''}</span></div>
        <p class="mt-3 border-t border-slate-100 pt-2 text-xs text-slate-500">${esc(t('nowServing'))}: <b class="text-slate-800">${info.serving?tok(info.serving):'—'}</b></p></div>`;
    }
  } else if(!isToday){
    queueCard = `<div class="${B.card} flex items-center gap-3"><span class="grid h-11 w-11 place-items-center rounded-xl bg-blue-50 text-blue-600"><i class="fa-solid fa-calendar-check"></i></span><div><p class="text-sm font-bold">${esc(dayLabel(p.date,L(),{weekday:'long',day:'numeric',month:'long'}))}</p><p class="text-xs text-slate-500">${esc(t('slotAt',{time:fmt12(p.slot)}))}</p></div></div>`;
  }
  const delayBanner = isToday && dl && !dl.full ? `<div class="rounded-2xl border border-rose-200 bg-rose-50 p-3 text-xs font-semibold text-rose-700"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i>${esc(t('delayBanner',{doc:doc.name,m:dl.mins}))}</div>` : '';
  return `<div class="space-y-3">
   <section class="rounded-3xl bg-gradient-to-br from-blue-800 to-slate-900 p-5 text-center text-white shadow-lg">
     <p class="text-[11px] font-bold uppercase tracking-widest text-blue-200">${esc(p.name)}</p>
     <p class="mt-2 text-[11px] text-blue-300">${esc(t('tokenYour'))}</p>
     <p class="text-6xl font-black tracking-tight text-cyan-300">${isToday?esc(tok(p)):'—'}</p>
     <p class="mt-1 text-sm font-semibold">${esc(doc.name)} <span class="font-normal text-blue-200">· ${esc(doc.spec[L()]||doc.spec.en)}</span></p>
     <p class="mt-1 text-xs text-amber-300">${p.slot?esc(t('slotAt',{time:fmt12(p.slot)})):esc(t('walkInQ'))}</p>
     <div class="mt-3">${pill(esc(stTxt),stCls)}</div></section>
   ${delayBanner}${queueCard}${payHTML(p,doc)}
   <section class="${B.card}"><h3 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400">${esc(t('updates'))}</h3>
    ${notes.length?`<ul class="space-y-2">${notes.filter((n,i,a)=>a.findIndex(m=>m.ts===n.ts&&m.text===n.text)===i).map(n=>`<li class="flex gap-2 text-xs"><span class="mt-0.5 flex gap-1 text-slate-400"><i class="fa-solid fa-message"></i><i class="fa-brands fa-whatsapp text-emerald-500"></i></span><span><span class="text-slate-700">${esc(n.text)}</span><span class="block text-[10px] text-slate-400">${fmt12(new Date(n.ts).getHours()*60+new Date(n.ts).getMinutes())}</span></span></li>`).join('')}</ul>`:`<p class="text-xs text-slate-400">${esc(t('noUpdates'))}</p>`}</section>
   <div class="grid grid-cols-2 gap-2"><button data-act="shareWa" class="${B.sm} min-h-[44px] bg-emerald-600 text-white hover:bg-emerald-700"><i class="fa-brands fa-whatsapp"></i>${esc(t('saveWa'))}</button>
    <button data-act="cancelMine" class="${B.sm} min-h-[44px] border border-rose-200 bg-white text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-xmark"></i>${esc(t('cancelTok'))}</button></div>
   <button data-act="newReg" class="w-full text-center text-xs font-semibold text-slate-400 hover:text-slate-600">${esc(t('rescan'))}</button></div>`;
}

function receptionHTML(){
  const tabs = [['queue','fa-list-check','Live Queue'],['schedule','fa-calendar-days','Schedule'],['payments','fa-indian-rupee-sign','Payments'],['messages','fa-comment-sms','Messages']];
  const waiting = S.patients.filter(p=>p.date===today()&&p.status==='waiting').length;
  return `<div class="space-y-4">
   <div class="${B.card} flex flex-wrap items-center justify-between gap-3">
    <div><h2 class="text-lg font-extrabold">Reception Console</h2><p class="text-xs text-slate-500">${waiting} waiting today · ${dayLabel(today(),'en',{weekday:'long',day:'numeric',month:'long'})}</p></div>
    <div class="flex flex-wrap gap-2">
     <button data-act="openAdd" class="${B.primary} !min-h-[40px]"><i class="fa-solid fa-user-plus"></i>Add patient</button>
     <button data-act="openEmergency" class="${B.danger} !min-h-[40px]"><i class="fa-solid fa-triangle-exclamation"></i>Emergency</button>
     <button data-act="openPoster" class="${B.ghost} !min-h-[40px]"><i class="fa-solid fa-qrcode"></i>QR poster</button></div></div>
   <nav class="no-scrollbar flex gap-1 overflow-x-auto rounded-2xl border border-slate-200 bg-white p-1 shadow-sm" aria-label="Reception sections">
    ${tabs.map(([id,ic,l])=>`<button data-act="rTab" data-id="${id}" aria-pressed="${ui.rTab===id}" class="flex min-h-[40px] flex-1 items-center justify-center gap-2 whitespace-nowrap rounded-xl px-3 text-xs font-bold transition ${ui.rTab===id?'bg-blue-600 text-white shadow-sm':'text-slate-600 hover:bg-slate-50'}"><i class="fa-solid ${ic}"></i>${l}</button>`).join('')}</nav>
   ${ui.rTab==='schedule'?scheduleHTML():ui.rTab==='payments'?paymentsHTML():ui.rTab==='messages'?messagesHTML():queueHTML()}</div>`;
}
function shiftNow(docId){
  const hrs = hoursOf(docId,today()), n = nowMin();
  const cur = hrs.find(h=>toMin(h.s)<=n && n<toMin(h.e));
  if(cur) return {on:true,txt:(cur.k==='m'?'Morning':'Evening')+' OPD · '+fmt12(cur.s)+'–'+fmt12(cur.e)};
  const nxt = hrs.find(h=>toMin(h.s)>n);
  if(nxt) return {on:false,txt:'Next: '+(nxt.k==='m'?'Morning':'Evening')+' OPD at '+fmt12(nxt.s)};
  return {on:false,txt:hrs.length?'OPD finished for today':'No OPD today'};
}
function payChip(p){
  if(p.pay.state==='paid') return pill('<i class="fa-solid fa-check"></i> Paid · '+esc(methodName('en',p.pay.method)),'bg-emerald-100 text-emerald-800');
  if(p.pay.state==='claimed') return pill('<i class="fa-solid fa-hourglass-half"></i> Patient says paid — verify','bg-amber-100 text-amber-800');
  return pill('Unpaid','bg-rose-100 text-rose-800');
}
function cardHTML(p,pos,total){
  const isWait = p.status==='waiting', isWith = p.status==='with';
  const payBtns = p.pay.state!=='paid' ? `<div class="flex flex-wrap items-center gap-1"><span class="text-[11px] font-semibold text-slate-400">Log:</span>${['cash','upi','upi_qr'].map(m=>`<button data-act="logPay" data-id="${p.id}" data-m="${m}" class="${B.sm} border border-slate-200 bg-white text-slate-700 hover:bg-slate-50">${esc(methodName('en',m))}</button>`).join('')}</div>` : '';
  return `<article class="qcard ${isWith?'border-emerald-300 bg-emerald-50/50':'bg-white'} rounded-xl border border-slate-200 p-3 shadow-sm" data-id="${p.id}" data-drag="${isWait?1:0}">
   <div class="flex items-start gap-2">
    ${isWait?`<span class="drag-handle -ml-1 grid h-10 w-8 shrink-0 place-items-center text-slate-400 hover:text-slate-700" title="Drag to reorder" aria-label="Drag to reorder"><i class="fa-solid fa-grip-vertical"></i></span>`:'<span class="w-1"></span>'}
    <div class="min-w-0 flex-1">
     <div class="flex flex-wrap items-center gap-1.5"><span class="rounded-md bg-blue-600 px-2 py-0.5 text-xs font-black text-white">${esc(tok(p))}</span><span class="truncate text-sm font-bold">${esc(p.name)}</span>${p.priority?'<i class="fa-solid fa-star text-amber-500" title="Priority"></i>':''}</div>
     <p class="mt-0.5 text-[11px] text-slate-500"><a href="tel:+91${esc(p.phone)}" class="font-semibold text-blue-700">+91 ${esc(p.phone)}</a> · ${esc(p.gender)} · ${p.slot?'<i class="fa-regular fa-clock"></i> '+fmt12(p.slot):'Walk-in'}</p></div>
    <button data-act="cancelPat" data-id="${p.id}" class="grid h-9 w-9 shrink-0 place-items-center rounded-lg text-slate-400 hover:bg-rose-50 hover:text-rose-600" aria-label="Cancel token"><i class="fa-solid fa-trash-can"></i></button></div>
   <div class="mt-2 flex flex-wrap items-center gap-1.5">
    ${isWait?`<button data-act="callIn" data-id="${p.id}" class="${B.sm} bg-emerald-600 text-white hover:bg-emerald-700"><i class="fa-solid fa-bell-concierge"></i>Call in</button>
      <button data-act="moveUp" data-id="${p.id}" ${pos===0?'disabled':''} class="${B.sm} border border-slate-200 bg-white disabled:opacity-30" aria-label="Move up"><i class="fa-solid fa-arrow-up"></i></button>
      <button data-act="moveDown" data-id="${p.id}" ${pos===total-1?'disabled':''} class="${B.sm} border border-slate-200 bg-white disabled:opacity-30" aria-label="Move down"><i class="fa-solid fa-arrow-down"></i></button>
      <button data-act="prio" data-id="${p.id}" class="${B.sm} border border-amber-200 bg-amber-50 text-amber-700 hover:bg-amber-100"><i class="fa-solid fa-star"></i>Priority</button>`:''}
    ${isWith?`<button data-act="complete" data-id="${p.id}" class="${B.sm} bg-blue-600 text-white hover:bg-blue-700"><i class="fa-solid fa-flag-checkered"></i>Complete visit</button>`:''}
   </div>
   <div class="mt-2 flex flex-wrap items-center justify-between gap-2 border-t border-slate-100 pt-2">
    <div class="flex items-center gap-2">${payChip(p)}<label class="flex items-center gap-1 text-[11px] text-slate-400">₹<input type="number" min="0" step="50" value="${p.fee}" data-chg="fee" data-id="${p.id}" aria-label="Fee" class="w-16 rounded-md border border-slate-200 px-1.5 py-1 text-xs font-bold text-slate-700"></label></div>
    ${payBtns}</div></article>`;

function laneHTML(doc){
  const all = laneAll(doc.id), withP = all.filter(p=>p.status==='with'), wait = all.filter(p=>p.status==='waiting'), done = all.filter(p=>p.status==='done');
  const sh = shiftNow(doc.id), dl = S.delays[doc.id];
  return `<section class="rounded-2xl border border-slate-200 bg-slate-50 p-3">
   <div class="mb-3 flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-full text-sm font-extrabold text-white" style="background:${doc.color}">${doc.code}</span>
    <div class="min-w-0 flex-1"><h3 class="truncate text-sm font-extrabold">${esc(doc.name)}</h3><p class="truncate text-[11px] ${sh.on?'font-semibold text-emerald-700':'text-slate-500'}"><i class="fa-solid fa-circle text-[7px] ${sh.on?'text-emerald-500':'text-slate-300'}"></i> ${esc(sh.txt)}</p></div>
    <div class="text-right"><p class="text-lg font-black leading-none text-blue-700">${wait.length}</p><p class="text-[10px] text-slate-400">waiting</p></div></div>
   ${dl?`<div class="mb-3 flex items-center justify-between gap-2 rounded-xl border border-rose-200 bg-rose-50 p-2.5 text-xs font-semibold text-rose-700"><span><i class="fa-solid fa-triangle-exclamation mr-1"></i>${dl.full?'Unavailable for the day':'Emergency delay +'+dl.mins+' min'}</span><button data-act="clearDelay" data-id="${doc.id}" class="rounded-lg bg-white px-2 py-1 text-[11px] font-bold text-rose-700 shadow-sm hover:bg-rose-100">Clear</button></div>`:''}
   <div class="space-y-2">${withP.map(p=>cardHTML(p,0,1)).join('')}
    <div class="lane-wait space-y-2" data-doc="${doc.id}">${wait.map((p,i)=>cardHTML(p,i,wait.length)).join('')}</div>
    ${!withP.length&&!wait.length?'<p class="rounded-xl border border-dashed border-slate-300 p-5 text-center text-xs text-slate-400">No patients in queue</p>':''}</div>
   ${done.length?`<details class="mt-3"><summary class="cursor-pointer text-xs font-semibold text-slate-500">${done.length} completed today</summary><ul class="mt-2 space-y-1">${done.map(p=>`<li class="flex items-center justify-between rounded-lg bg-white px-2.5 py-1.5 text-xs"><span><b>${esc(tok(p))}</b> ${esc(p.name)}</span>${payChip(p)}</li>`).join('')}</ul></details>`:''}</section>`;

function queueHTML(){
  const docs = S.doctors.filter(d=>ui.laneDoc==='all'||d.id===ui.laneDoc);

}

     <input type="time" step="600" value="${e.s}" ${e.on?'':'disabled'} data-chg="sched" data-doc="${doc.id}" data-date="${ds}" data-sh="${k}" data-f="s" class="w-[7.2rem] rounded-lg border border-slate-200 px-2 py-1.5 text-xs font-semibold disabled:opacity-40" aria-label="Start">

   <div class="flex flex-wrap items-center justify-between gap-2"><div><h3 class="text-base font-extrabold">7-day OPD schedule</h3><p class="text-xs text-slate-500">Morning and evening shifts per doctor. Patients book 10-minute slots inside these windows.</p></div>
    <button data-act="copyDay" class="${B.ghost} !min-h-[38px] text-xs"><i class="fa-regular fa-copy"></i>Copy today’s timings to all days</button></div>

   <div class="overflow-x-auto"><table class="w-full min-w-[640px] text-left text-sm"><thead><tr class="text-[11px] uppercase tracking-wide text-slate-400"><th class="py-2 pr-3">Day</th><th class="py-2 pr-3">🌅 Morning OPD</th><th class="py-2">🌇 Evening OPD</th></tr></thead>
    <tbody class="divide-y divide-slate-100">${days.map(ds=>`<tr><td class="whitespace-nowrap py-2.5 pr-3 text-xs font-bold">${esc(ds===today()?'Today':dayLabel(ds,'en'))}</td><td class="py-2.5 pr-3">${cell(ds,'m')}</td><td class="py-2.5">${cell(ds,'e')}</td></tr>`).join('')}</tbody></table></div></section>`;

function history(){
  const out=[], t0=today();
  for(let i=0;i<60;i++){
    const d=addDays(t0,-i), dow=new Date(d+'T00:00:00').getDay();
    S.doctors.forEach(doc=>{
      const base = (DOCS.find(x=>x.id===doc.id)||{base:12}).base;
      let n = Math.round(base*(dow===0?0.5:1)*(0.8+(hash(d+doc.id)%41)/100));
      if(i===0) n = Math.round(n*0.5);
      out.push({date:d,docId:doc.id,n,amt:n*doc.fee});
    });
  }
  return out;
}
function analytics(period){
  const n = period==='day'?1:period==='week'?7:30, t0 = today();
  const curFrom = addDays(t0,-(n-1)), prevFrom = addDays(t0,-(2*n-1)), prevTo = addDays(t0,-n);
  const H = history();
  const sum = (from,to)=>{ const per={}; S.doctors.forEach(d=>per[d.id]={n:0,amt:0}); H.forEach(r=>{ if(r.date>=from&&r.date<=to){ per[r.docId].n+=r.n; per[r.docId].amt+=r.amt; } }); return per; };
  const cur = sum(curFrom,t0), prev = sum(prevFrom,prevTo);
  let upi=0, cash=0; Object.values(cur).forEach(v=>{ upi+=v.amt*.65; cash+=v.amt*.35; });
  S.patients.forEach(p=>{ if(p.date===t0 && p.status==='done'){ cur[p.docId].n++; if(p.pay.state==='paid'){ cur[p.docId].amt+=p.fee; if(p.pay.method==='cash') cash+=p.fee; else upi+=p.fee; } } });
  const tot = o => Object.values(o).reduce((a,v)=>({n:a.n+v.n,amt:a.amt+v.amt}),{n:0,amt:0});
  const c = tot(cur), p = tot(prev);
  const dueNow = S.patients.filter(x=>x.date===t0&&x.status!=='cancelled'&&x.pay.state!=='paid').reduce((a,x)=>a+x.fee,0);
  const trendDays = n===30?30:7, trend=[];
  for(let i=trendDays-1;i>=0;i--){ const d=addDays(t0,-i); let v=H.filter(r=>r.date===d).reduce((a,r)=>a+r.n,0); if(i===0) v+=S.patients.filter(x=>x.date===t0&&x.status==='done').length; trend.push({d,v}); }
  return {n,cur,c,p,upi,cash,dueNow,trend};
}

/* ───────────── Drag & drop (mouse + touch via pointer events) ───────────── */
document.addEventListener('pointerdown', e=>{
  const h = e.target.closest('.drag-handle'); if(!h) return;
  const card = h.closest('.qcard'); if(!card) return;
  e.preventDefault();
  drag = {card, list:card.parentElement, before:[...card.parentElement.children].map(c=>c.dataset.id).join()};
  card.classList.add('dragging');
});
document.addEventListener('pointermove', e=>{
  if(!drag) return;
  e.preventDefault();
  const y = e.clientY;
  if(y<80) window.scrollBy(0,-12); else if(y>window.innerHeight-80) window.scrollBy(0,12);
  const sibs = [...drag.list.querySelectorAll('.qcard:not(.dragging)')];
  const ref = sibs.find(s=>{ const r=s.getBoundingClientRect(); return y < r.top + r.height/2; });
  if(ref) { if(ref.previousElementSibling!==drag.card) drag.list.insertBefore(drag.card,ref); }
  else if(drag.list.lastElementChild!==drag.card) drag.list.appendChild(drag.card);
},{passive:false});
function endDrag(){
  if(!drag) return;
  const {card,list,before} = drag; drag = null; card.classList.remove('dragging');
  const ids = [...list.children].map(c=>c.dataset.id);
  if(ids.join()!==before) commitOrder(list.dataset.doc, ids); else if(pendingRender){ pendingRender=false; render(); }
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);
function commitOrder(docId, ids){
  const idxs = S.patients.map((p,i)=>(p.docId===docId&&p.date===today()&&p.status==='waiting')?i:-1).filter(i=>i>=0);
  const byId = Object.fromEntries(S.patients.map(p=>[p.id,p]));
  if(idxs.length!==ids.length) { pendingRender=false; render(); return; }
  idxs.forEach((ai,k)=>{ S.patients[ai]=byId[ids[k]]; });
  S.patients.forEach(p=>{ if(p.docId===docId) p.nearSent = false; });
  afterChange(); pendingRender=false; save(); toast('Queue reordered · token numbers updated');
}
function moveInLane(id,dir){
  const p = S.patients.find(x=>x.id===id); if(!p) return;
  const lane = laneAll(p.docId).filter(x=>x.status==='waiting'), i = lane.indexOf(p), j = i+dir;
  if(j<0||j>=lane.length) return;
  const ids = lane.map(x=>x.id); [ids[i],ids[j]] = [ids[j],ids[i]];
  commitOrder(p.docId, ids);
}

    if(slot && S.patients.some(p=>p.docId===doc.id&&p.date===draft.date&&p.slot===slot&&p.status!=='cancelled')){ toast('That slot was just taken — please pick another.','err'); draft.slot=''; render(); return; }
    const p = {id:uid(),name:draft.name.trim(),phone:draft.phone,gender:draft.gender,docId:doc.id,date:draft.date,slot,shift:slot?draft.shift:'',status:'waiting',fee:doc.fee,pay:{state:'due',method:null,at:null},lang:ui.lang,priority:false,createdAt:Date.now()};
    insertPatient(p); ui.me = p.id;
    if(p.date===today()) notify(p,'n_reg',{token:tok(p),wait:qInfo(p).wait}); else notify(p,'n_book',{date:dayLabel(p.date,p.lang),time:fmt12(p.slot)});
    afterChange(); save(); window.scrollTo(0,0);
    toast('SMS + WhatsApp sent to +91 '+p.phone);
  },
  iPaid(){ const p=S.patients.find(x=>x.id===ui.me); if(!p) return; p.pay.state='claimed'; save(); toast('Reception has been alerted to verify your payment.'); },
  shareWa(){
    const p=S.patients.find(x=>x.id===ui.me); if(!p) return;
    const msg = p.date===today() ? tx(ui.lang,'n_reg',{doc:docById(p.docId).name,token:tok(p),wait:qInfo(p).wait,link:baseUrl()+'?p='+p.id}) : tx(ui.lang,'n_book',{doc:docById(p.docId).name,date:dayLabel(p.date,ui.lang),time:fmt12(p.slot),link:baseUrl()+'?p='+p.id});
    window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');
  },
  cancelMine(){ confirmDialog(t('cancelAsk'),'',t('yes'),()=>cancelPatient(ui.me,true),true,t('keep')); },
  newReg(){ ui.me=null; ui.pStage='scan'; render(); },
  dlgClose(){ closeDialog(); },
  dlgYes(){ const f=pendingConfirm; closeDialog(); if(f) f(); },
  resetDemo(){ confirmDialog('Reset demo data?','All patients, schedules and messages return to the sample data.','Reset',()=>{ ls.set(KEY,''); seedState(); ui.me=null; ui.pStage='scan'; save(); toast('Demo data reset'); },true); },
  openAdd, openEmergency, openPoster, applyEmergency,
  callIn(id){
    const p=S.patients.find(x=>x.id===id), cur=laneAll(p.docId).find(q=>q.status==='with'&&q!==p);
    if(cur){ toast(`Complete ${tok(cur)} ${cur.name} first`,'err'); return; }
    p.status='with'; notify(p,'n_called',{token:tok(p)}); afterChange(); save();
  },
  complete(id){ const p=S.patients.find(x=>x.id===id); p.status='done'; p.doneAt=Date.now(); afterChange(); save(); if(p.pay.state!=='paid') toast('Visit complete — payment still pending','warn'); },
  prio(id){ const p=S.patients.find(x=>x.id===id); const lane=laneAll(p.docId).filter(x=>x.status==='waiting'); if(lane[0]===p){ toast('Already first in line'); return; } p.priority=true; const ids=[p.id,...lane.filter(x=>x!==p).map(x=>x.id)]; commitOrder(p.docId,ids); },
  moveUp(id){ moveInLane(id,-1); }, moveDown(id){ moveInLane(id,1); },
  cancelPat(id){ const p=S.patients.find(x=>x.id===id); confirmDialog('Cancel '+p.name+'?','The patient will be notified by SMS and WhatsApp.','Cancel token',()=>cancelPatient(id,false),true,'Keep'); },
  logPay(id,el){ const p=S.patients.find(x=>x.id===id), m=el.dataset.m; p.pay={state:'paid',method:m,at:Date.now()}; notify(p,'n_paid',{amt:p.fee,method:methodName(p.lang||'en',m)}); save(); toast(`${money(p.fee)} logged via ${methodName('en',m)}`); },
  clearDelay(id){ delete S.delays[id]; S.patients.filter(p=>p.docId===id&&p.date===today()&&p.status==='waiting').forEach(p=>notify(p,'n_clear',{wait:qInfo(p).wait})); save(); toast('Delay cleared · patients notified'); },
  copyDay(){ const doc=ui.schedDoc, src=S.sched[doc][today()]; Object.keys(S.sched[doc]).forEach(ds=>{ S.sched[doc][ds]={m:{...src.m},e:{...src.e}}; }); save(); toast('Timings copied to all 7 days'); }
};
function cancelPatient(id,mine){
  const p=S.patients.find(x=>x.id===id); if(!p) return;
  const label = p.date===today() ? tok(p) : '';
  p.status='cancelled'; notify(p,'n_cancel',{token:label||fmt12(p.slot||'00:00')});
  S.patients.filter(q=>q.docId===p.docId).forEach(q=>q.nearSent=false);
  afterChange(); save(); toast('Token cancelled','warn');
}
const chg = {
  lang(v){ ui.lang=v; render(); },
  fee(v,el){ const p=S.patients.find(x=>x.id===el.dataset.id); if(p){ p.fee=Math.max(0,parseFloat(v)||0); save(); } },
  upi(v,el){ const d=docById(el.dataset.id); v=v.trim(); if(!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v)){ toast('Enter a valid UPI ID like name@bank','err'); render(); return; } d.upi=v; save(); toast('UPI ID saved for '+d.name); },
  docFee(v,el){ const d=docById(el.dataset.id); d.fee=Math.max(0,parseFloat(v)||0); save(); toast('Fee updated for '+d.name); },
  sched(v,el){
    const {doc,date,sh,f}=el.dataset, e=S.sched[doc][date][sh];
    if(f==='on') e.on = el.checked; else {
      const old=e[f]; e[f]=v;
      if(!v || toMin(e.e)-toMin(e.s)<SLOT){ e[f]=old; toast('End time must be at least 10 minutes after start','err'); }
    }
    save();
  }
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(el){ const fn = act[el.dataset.act]; if(fn) fn(el.dataset.id, el); return; }
  if(e.target.id==='dlg') closeDialog();
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-chg]');
  if(el && chg[el.dataset.chg]) { chg[el.dataset.chg](el.type==='checkbox'?el.checked:el.value, el); return; }
  if(e.target.id==='add-doc'){ $('#add-slot').innerHTML=slotOptionsFor(e.target.value); $('#add-fee').value=docById(e.target.value).fee; }
  if(e.target.id==='em-doc') updateEmPreview();
});
document.addEventListener('input', e=>{
  const k = e.target.dataset && e.target.dataset.draft; if(!k) return;
  draft[k] = k==='phone' ? e.target.value.replace(/\D/g,'').slice(0,10) : e.target.value;
  if(k==='phone') e.target.value = draft.phone;
});
document.addEventListener('submit', e=>{
  if(e.target.id!=='addForm') return;
  e.preventDefault();
  const f = new FormData(e.target), doc = docById(f.get('doc')), slot = f.get('slot')||'';
  const p = {id:uid(),name:String(f.get('name')).trim(),phone:f.get('phone'),gender:f.get('gender'),docId:doc.id,date:today(),slot,shift:slot?(toMin(slot)<780?'m':'e'):'',status:'waiting',fee:Math.max(0,parseFloat(f.get('fee'))||doc.fee),pay:{state:'due',method:null,at:null},lang:f.get('lang'),priority:false,createdAt:Date.now()};
  insertPatient(p); notify(p,'n_reg',{token:tok(p),wait:qInfo(p).wait}); afterChange();
  closeDialog(); save(); toast(`${tok(p)} booked · SMS + WhatsApp sent to +91 ${p.phone}`);
});

/* ───────────── Live sync across tabs ───────────── */
function editing(){ const a=document.activeElement; return a && ['INPUT','SELECT','TEXTAREA'].includes(a.tagName) && !$('#dlg').open && a.closest('#app') && a.closest('main'); }
window.addEventListener('storage', e=>{
  if(e.key!==KEY || !e.newValue) return;
  try{ S = JSON.parse(e.newValue); }catch(err){ return; }
  if(editing()) { pendingRender = true; return; }
  if(!$('#dlg').open) render();
});
document.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(pendingRender && !editing() && !drag){ pendingRender=false; render(); } },150); });
setInterval(()=>{ if(!editing() && !drag && !$('#dlg').open){ ensureSchedule(); render(); } }, 30000);

/* ───────────── Boot ───────────── */
loadState(); loadUI(); render();
})();
</script>
</body>
</html>
